<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Страница обо мне</title>
        <style>
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }
            body {
                background-color: #918383;
                font-family: Arial, sans-serif;
                line-height: 1.6;
            }
            #main {
                max-width: 90%;
                width: 720px;
                margin: 20px auto;
                border: 3px solid #262222;
                background-color: #786b6b;
                overflow: hidden;
            }
            #header {
                height: 80px;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 25px;
                border-bottom: 5px solid #403939;
                background-color: #5c5252;
            }
            #photo {
                width: 400px;
                max-width: 100%;
                height: 1000px;
                max-height: 55vh;
                float: left;
                border-right: 3px solid #403939;
                background-color: #786b6b;
                position: relative;
            }
            #text {
                width: 300px;
                max-width: 100%;
                margin-top: 362px;
                float: right;
                text-indent: -3px;
                display: flex;
                align-items: flex-end;
                font-size: 40px;
            }
            #tex {
                width: 257px;
                max-width: 100%;
                margin-top: -33px;
                float: right;
                text-indent: -46px;
                display: flex;
                align-items: flex-end;
                font-size: 40px;
            }
            #te {
                width: 100%;
                margin-top: -460px;
                float: right;
                text-indent: 10px;
                display: flex;
                align-items: flex-end;
                font-size: 20px;
                padding-left: 400px;
                box-sizing: border-box;
            }
            #footer {
                height: auto;
                min-height: 25px;
                display: flex;
                align-items: center;
                justify-content: center;
                clear: both;
                border-top: 3px solid #403939;
                background-color: #5c5252;
                padding: 1px 0;
                flex-wrap: nowrap;
            }
            img {
                object-fit: cover;
                object-position: center;
                width: 100%;
                height: 100%;
            }
            a {
                color: #e1d9dd;
                text-decoration: none;
            }
            a:hover {
                text-decoration: underline;
            }
            @media (max-width: 768px) {
                #main {
                    width: 100%;
                    margin: 10px;
                }
                #photo, #text, #tex, #te {
                    float: none;
                    width: 100%;
                    max-width: 100%;
                }
                #photo {
                    height: 300px;
                    max-height: none;
                }
                #text, #tex {
                    font-size: 32px;
                    margin-top: 10px;
                }
                #te {
                    font-size: 10px;
                    margin-top: 10px;
                }
            }
        </style>
    </head>
    <body>
        <div id="main">
            <div id="header"><em>Приветствую вас с улыбкой и открытым сердцем!</em></div>
            <div id="photo">
                <img src="https://sun9-51.userapi.com/s/v1/ig2/RaaaNvoQCyYhTP2PAHiPGtOYUzA47SbMeCo32sinq0H4f7aCtFJwAfe73FZoRhJPPZXhvTjR23fY4z6KH5Rm5hyh.jpg?quality=95&as=32x43,48x64,72x96,108x144,160x213,240x320,360x480,480x640,540x720,640x853,720x960,960x1280&from=bu&u=hCizVvAacJOBDLjgyAU4B6O_IWGyzOGJJvpCaPWp0So&cs=360x0" alt="Фото Надежды Поляковой">
            </div>
            <div id="text"><p style="color: #262222">Полякова</p></div>
            <div id="tex"><p style="color: #262222">Надежда</p></div>
            <div id="te"><p style="color: #262222">Ученица МБОУ Курумканской СОШ №1 имени Р.Р.Будаева</p></div>
            <div id="footer">
                <p><em>Связаться по почте: <a href="https://mail.yandex.ru" target="_blank">nadyapolukova2010@yandex.ru</a></em></p>
            </div>
            <div id="footer">
                <p>Связаться через: <a href="https://vk.com/id781579276" target="_blank">социальную сеть</a></p>
            </div>
            <div id="footer">
                <p>Связаться по номеру телефона: <a href="tel:+79834029465">+7 983 402-94-65</a></p>
            </div>
        </div>
    </body>
</html>
